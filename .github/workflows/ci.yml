name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck kur
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: shellcheck -x -s bash scripts/index-publish.sh
      - name: Syntax check (bash -n)
        run: bash -n scripts/index-publish.sh
  tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: bats kur
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Testler
        run: bats test
